<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card source</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist+Mono:wght@500&display=swap" />
<style>
  *{ box-sizing:border-box; margin:0; }
  html,body{ background:#17171c; display:grid; place-items:center; height:100%; }
  /* The card is authored at exactly 1200x630 so the capture needs no guesswork.
     Rebuild it by loading this file and screenshotting #card. */
  #card{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:#0a0a0d; color:#f5f5f7; isolation:isolate;
    font-family:'Bricolage Grotesque', system-ui, sans-serif;
  }
  #card img.shot{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92;
  }
  #card .wash{
    position:absolute; inset:0;
    background:
      linear-gradient(to top, #0a0a0d 4%, rgba(10,10,13,.36) 46%, rgba(10,10,13,.06) 100%),
      linear-gradient(to right, rgba(10,10,13,.88) 0%, rgba(10,10,13,.3) 52%, rgba(10,10,13,0) 82%);
  }
  #card .beam{ position:absolute; inset:0; mix-blend-mode:screen; opacity:.8; }
  #card .in{
    position:absolute; left:66px; right:66px; bottom:58px; z-index:2;
    display:flex; align-items:flex-end; justify-content:space-between; gap:40px;
  }
  h1{
    font-weight:800; font-size:72px; line-height:.96; letter-spacing:-.05em; max-width:14ch;
  }
  h1 em{ font-style:normal; color:#ccff33; }
  .mark{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .mark svg{ height:34px; width:auto; }
  .mark b{ font-size:30px; font-weight:800; letter-spacing:-.03em; }
  .meta{
    font-family:'Geist Mono', monospace; font-size:15px; letter-spacing:.18em;
    text-transform:uppercase; color:#a3a3ad; text-align:right; white-space:nowrap; line-height:2;
  }
  .meta span{ color:#ccff33; }
  .rule{
    position:absolute; left:0; right:0; bottom:0; height:5px; z-index:3;
    background:linear-gradient(90deg,#ff2d9b 0%,#ccff33 52%,#2de1ff 100%);
  }
</style>
</head>
<body>
<div id="card">
  <img class="shot" src="img/enchanted/2.webp" alt="" />
  <div class="wash"></div>
  <svg class="beam" viewBox="0 0 1200 630" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d9b"/><stop offset=".52" stop-color="#ccff33"/><stop offset="1" stop-color="#2de1ff"/>
    </linearGradient></defs>
    <path d="M-30 660 L760 -30" stroke="url(#g)" stroke-width="2.5" fill="none"/>
    <path d="M30 660 L820 -30" stroke="url(#g)" stroke-width="1" opacity=".4" fill="none"/>
  </svg>
  <div class="in">
    <div>
      <div class="mark">
        <svg viewBox="0 0 24 33" fill="none"><rect x="0" y="0" width="6" height="33" fill="#f5f5f7"/><rect x="9" y="0" width="15" height="6" fill="#f5f5f7"/><rect x="9" y="13.5" width="6" height="6" fill="#ccff33"/></svg>
        <b>f34r</b>
      </div>
      <h1>Worlds that hold up<br />at <em>400 million</em> visits.</h1>
    </div>
    <div class="meta">
      <span>400M+</span> visits contributed<br />
      Interiors &nbsp;/&nbsp; Terrain &nbsp;/&nbsp; Full maps<br />
      f34r.dev
    </div>
  </div>
  <div class="rule"></div>
</div>
<button id="render" style="position:fixed;top:16px;left:16px;z-index:9;padding:10px 18px;border-radius:999px;border:0;background:#ccff33;color:#0a0d02;font:600 14px system-ui;cursor:pointer">Download og-cover.jpg</button>
<script>
/* The card above is the layout reference. This draws the same thing to a
   canvas at exactly 1200x630 and downloads it, which is how img/og-cover.jpg
   is produced. Screenshotting the div works too but is at the mercy of window
   scaling; this is exact, and it uses the real webfont because the page has
   already loaded it. */
document.getElementById("render").addEventListener("click", async () => {
  await document.fonts.load('800 72px "Bricolage Grotesque"');
  await document.fonts.load('500 15px "Geist Mono"');
  const W = 1200, H = 630;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const img = document.querySelector("#card img.shot");
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  x.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);

  let g = x.createLinearGradient(0, H, 0, 0);
  g.addColorStop(0, "#0a0a0d"); g.addColorStop(.46, "rgba(10,10,13,.36)"); g.addColorStop(1, "rgba(10,10,13,.06)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(10,10,13,.88)"); g.addColorStop(.52, "rgba(10,10,13,.3)"); g.addColorStop(.82, "rgba(10,10,13,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  const bg = x.createLinearGradient(0, H, W, 0);
  bg.addColorStop(0, "#ff2d9b"); bg.addColorStop(.52, "#ccff33"); bg.addColorStop(1, "#2de1ff");
  x.strokeStyle = bg; x.lineWidth = 2.5;
  x.beginPath(); x.moveTo(-30, 660); x.lineTo(760, -30); x.stroke();
  x.globalAlpha = .4; x.lineWidth = 1;
  x.beginPath(); x.moveTo(30, 660); x.lineTo(820, -30); x.stroke();
  x.globalAlpha = 1;

  const mx = 66, my = 430;
  x.fillStyle = "#f5f5f7";
  x.fillRect(mx, my, 6.2, 34); x.fillRect(mx + 9.3, my, 15.5, 6.2);
  x.fillStyle = "#ccff33"; x.fillRect(mx + 9.3, my + 13.9, 6.2, 6.2);
  x.fillStyle = "#f5f5f7";
  x.font = '800 30px "Bricolage Grotesque", sans-serif';
  x.fillText("f34r", mx + 40, my + 27);

  x.font = '800 72px "Bricolage Grotesque", sans-serif';
  x.fillText("Worlds that hold up", 66, 512);
  const p = "at "; x.fillText(p, 66, 581);
  const pw = x.measureText(p).width;
  x.fillStyle = "#ccff33"; x.fillText("400 million", 66 + pw, 581);
  const nw = x.measureText("400 million").width;
  x.fillStyle = "#f5f5f7"; x.fillText(" visits.", 66 + pw + nw, 581);

  x.font = '500 15px "Geist Mono", monospace'; x.textAlign = "right";
  x.fillStyle = "#ccff33";
  x.fillText("400M+", 1134 - x.measureText(" visits contributed").width, 512);
  x.fillStyle = "#a3a3ad";
  x.fillText(" visits contributed", 1134, 512);
  x.fillText("STUD MAPS  /  TERRAIN  /  FULL MAPS", 1134, 542);
  x.fillText("F34R.DEV", 1134, 572);
  x.textAlign = "left";

  const rg = x.createLinearGradient(0, 0, W, 0);
  rg.addColorStop(0, "#ff2d9b"); rg.addColorStop(.52, "#ccff33"); rg.addColorStop(1, "#2de1ff");
  x.fillStyle = rg; x.fillRect(0, H - 5, W, 5);

  const a = document.createElement("a");
  a.download = "og-cover.jpg";
  a.href = cv.toDataURL("image/jpeg", 0.9);
  a.click();
});
</script>
</body>
</html>
